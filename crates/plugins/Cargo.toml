[package]
name = "kerndns-plugins"
description = "Native Rust ports of CoreDNS plugins for KernDNS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arc-swap.workspace = true
kerndns-core.workspace = true
tokio.workspace = true
thiserror.workspace = true
data-encoding.workspace = true
regex.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
http.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2"] }
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
prometheus.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
ring.workspace = true
md-5.workspace = true
pprof.workspace = true
flate2.workspace = true
maxminddb.workspace = true
serde.workspace = true
# ACME (tls plugin): ring only, no aws-lc-rs
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
tower-service = "0.3"
quinn.workspace = true
idna = "1"
serde_json = "1"
if-addrs = "0.15"
socket2.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
