[package]
name = "kerndns-kubernetes"
description = "Port of CoreDNS's kubernetes plugin for KernDNS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kerndns-core.workspace = true
kerndns-plugins.workspace = true
tokio.workspace = true
kube = { version = "5", default-features = false, features = ["client", "runtime", "rustls-tls", "config"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
futures-util.workspace = true
serde = { version = "1", features = ["derive"] }
if-addrs = "0.15"

[dev-dependencies]
serde_json = "1"
data-encoding.workspace = true
