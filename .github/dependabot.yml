version: 2
updates:
  # the workspace (crates/*, xtask) and the cargo-fuzz targets, which are
  # outside the workspace with their own Cargo.lock
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # go/bridge embeds CoreDNS plugins; github.com/coredns/coredns comes from
  # the third_party/coredns submodule (a replace), so it is bumped with the
  # submodule, not here
  - package-ecosystem: gomod
    directories:
      - /go/bridge
      - /go/difftest
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/coredns/coredns
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # the Dockerfile's base images (pinned by digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]
