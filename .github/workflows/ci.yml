name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-go@v7
        with:
          go-version-file: third_party/coredns/go.mod
          cache-dependency-path: third_party/coredns/go.sum
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Every plugin has a benchmark scenario
        run: cargo xtask bench --check
      - name: CoreDNS integration tests
        run: cargo xtask compat-test
      - name: Differential test against CoreDNS
        run: cargo xtask difftest
      - name: Go bridge (CoreDNS's etcd tests with Go etcd inside KernDNS)
        run: |
          sudo apt-get install -y etcd-server
          cargo xtask compat-test --bridge

  bench-smoke:
    # a short level 2 run of a few scenarios: checks that the harness and
    # the scenarios work with both servers (the numbers mean nothing here)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: third_party/coredns/go.mod
          cache-dependency-path: third_party/coredns/go.sum
      - run: sudo apt-get update && sudo apt-get install -y dnsperf
      - run: cargo xtask bench --level 2 --plugin cache,file,rewrite,tsig --duration 1

  image:
    # the drop-in CoreDNS replacement image, started the way kubeadm's
    # Deployment runs it; pushed to ghcr.io on pushes to main and v* tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kerndns
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=KernDNS, a prototype Rust port of CoreDNS. Not for production use.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kerndns:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve with kubeadm's container settings
        run: |
          mkdir conf
          printf '.:53 {\n    errors\n    health\n    ready\n    whoami\n}\n' > conf/Corefile
          docker run -d --name kerndns -p 1053:53/udp -p 8080:8080 -p 8181:8181 \
            --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            -v "$PWD/conf:/etc/coredns:ro" kerndns:ci -conf /etc/coredns/Corefile
          for i in $(seq 30); do curl -sf localhost:8181/ready && break; sleep 1; done
          curl -sf localhost:8080/health
          dig @127.0.0.1 -p 1053 whoami.example.org | grep -q 'status: NOERROR'
          docker logs kerndns
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  kind:
    # CoreDNS's end-to-end Kubernetes tests (github.com/coredns/ci,
    # test/kubernetes) with the KernDNS image as the cluster DNS, set up
    # the way coredns/ci's build/kubernetes/k8s_setup.sh does it for CoreDNS
    runs-on: ubuntu-latest
    env:
      CI_REPO_COMMIT: 326aa942bde33d4dcd6b19e05e0dfb4fd7b79f68
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: third_party/coredns/go.mod
          cache-dependency-path: third_party/coredns/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build the image as "coredns", the name coredns/ci's patch uses
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: coredns:latest
          cache-from: type=gha
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Check out coredns/ci next to CoreDNS (its go.mod replaces ../coredns)
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          git clone -q https://github.com/coredns/ci "$RUNNER_TEMP/src/ci"
          git -C "$RUNNER_TEMP/src/ci" checkout -q "$CI_REPO_COMMIT"
          ln -s "$GITHUB_WORKSPACE/third_party/coredns" "$RUNNER_TEMP/src/coredns"
      - name: Set up the cluster like coredns/ci
        working-directory: ${{ runner.temp }}/src/ci/build/kubernetes
        run: |
          kind load docker-image coredns:latest --name kind
          kubectl -n kube-system scale deployment/coredns --replicas=1
          kubectl -n kube-system patch deployment coredns -p "$(cat coredns_deployment_patch.yaml)"
          kubectl -n kube-system patch clusterroles system:coredns -p "$(cat coredns_clusterroles_patch.yaml)"
          kubectl create -f dns-test.yaml
          # no rollout wait: the patched Deployment mounts a Zonefile key the
          # ConfigMap only gets when a test loads one (LoadCorefileAndZonefile),
          # and the tests wait for the DNS pod to be ready themselves
      - name: Run coredns/ci test/kubernetes
        working-directory: ${{ runner.temp }}/src/ci/test/kubernetes
        shell: bash
        run: |
          go mod tidy
          go test -v -timeout 40m ./... 2>&1 | tee "$RUNNER_TEMP/kind-tests.log"
      - if: always()
        name: Summary
        run: |
          grep -E '^(--- |ok |FAIL)' "$RUNNER_TEMP/kind-tests.log" || true
          kubectl -n kube-system get pods -l k8s-app=kube-dns -o wide || true
          kubectl -n kube-system describe pods -l k8s-app=kube-dns | tail -40 || true
          kubectl -n kube-system logs -l k8s-app=kube-dns --tail=200 || true

  fuzz:
    # builds the cargo-fuzz targets (fuzz/, nightly) and runs each for a
    # minute from the committed seeds; longer runs are local (see README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run each fuzz target for 60 s
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            mkdir -p corpus/$t
            cargo +nightly fuzz run $t corpus/$t seeds/$t -- \
              -max_total_time=60 -timeout=10 -rss_limit_mb=4096 -close_fd_mask=1
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
